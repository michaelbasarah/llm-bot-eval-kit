name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # The whole suite again with the clock pushed 6 months forward. Catches a date literal
      # rotting (green today, red on some random morning with zero code change) right now.
      - run: npm run test:future
      # Persona scenarios. Fake mode without a key; add a GEMINI_API_KEY repo secret to run them
      # against the live model on every push.
      - run: npm run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  gates:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Start the toy bot
        run: |
          PORT=3000 node bot/server.mjs &
          for i in $(seq 1 20); do curl -sf http://localhost:3000/health && break; sleep 0.5; done
      - run: npm run golden
        env:
          BASE_URL: http://localhost:3000
      - run: npm run smoke
        env:
          BASE_URL: http://localhost:3000
